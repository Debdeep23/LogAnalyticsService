server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: storage-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logdb}
    username: ${SPRING_DATASOURCE_USERNAME:loguser}
    password: ${SPRING_DATASOURCE_PASSWORD:logpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: storage-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "logEvent:com.loganalytics.storage.dto.LogEvent"
      max-poll-records: 100

kafka:
  topic:
    logs: ${KAFKA_TOPIC_LOGS:logs_raw}

# ===== Storage Configuration =====
# Set storage.provider to switch between local (minio) and cloud (aws-s3)
storage:
  provider: ${STORAGE_PROVIDER:minio}  # Options: "minio" or "aws-s3"
  batch:
    size: 100
    flush-interval-ms: 5000

# MinIO Configuration (local development - S3 compatible)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:logs-raw}

# AWS S3 Configuration (production)
aws:
  region: ${AWS_REGION:us-east-1}
  # Credentials: Use IAM roles in production, or set these for local testing
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:logs-raw}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.loganalytics: DEBUG
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN
    software.amazon.awssdk: WARN
