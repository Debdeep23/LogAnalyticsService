server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: query-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logdb}
    username: ${SPRING_DATASOURCE_USERNAME:loguser}
    password: ${SPRING_DATASOURCE_PASSWORD:logpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.loganalytics: DEBUG
    org.hibernate.SQL: WARN

query:
  default-page-size: 20
  max-page-size: 100

